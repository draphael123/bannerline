// CAMPAIGN MAP + STORE
//////////////////////////////////////////////////////////////////////////////
// three worlds, three battles each — a row per world
function mapNode(i){
  const w = Math.floor(i/3), c = i%3;
  return { x:150 + c*170, y:118 + w*66 };
}
const MAP_NODES = { length:9 };
const MAP_SHOP  = {x:W/2-70, y:322, w:140, h:24};
const MAP_BACK  = {x:12, y:8, w:74, h:22};
function nodeBox(i){ const n=mapNode(i); return {x:n.x-23, y:n.y-23, w:46, h:46}; }

function drawMap(){
  // parchment
  px(0,0,W,H,"#2a2118");
  px(0,0,W,H,"#3b2f22");
  for(let y=0;y<H;y+=4) for(let x=((y/4)%2)*4;x<W;x+=8) px(x,y,4,4,"#41341f");
  ctx.globalAlpha=0.5;
  for(let i=0;i<70;i++){ const rx=(i*137)%W, ry=(i*89)%H; px(rx,ry,3,2,"#4d3d28"); }
  ctx.globalAlpha=1;
  px(0,0,W,6,"#241a12"); px(0,H-6,W,6,"#241a12");
  px(0,0,6,H,"#241a12"); px(W-6,0,6,H,"#241a12");

  // hand-drawn cartography: a coast, hills, woods and a compass, all from a
  // fixed seed so the map is the same place every time you open it.
  const rnd = mulberry(4242);
  // coastline along the top
  for(let x=0; x<W; x+=6){
    const y = 96 + Math.sin(x*0.031)*9 + Math.sin(x*0.077)*4;
    px(x, y, 5, 2, "#5b6f7a");
    px(x, y+3, 4, 1, "#4a5b66");
    if((x/6)%3===0) px(x+1, y-4, 3, 2, "#63808c");
  }
  ctx.globalAlpha = 0.30;
  px(0, 60, W, 40, "#3f5560");
  ctx.globalAlpha = 1;
  // hills
  for(let i=0;i<11;i++){
    const hx = 30 + rnd()*(W-60), hy = 118 + rnd()*24;
    if(Math.abs(hx-320) < 40 && hy < 160) continue;
    px(hx-9, hy, 19, 3, "#6b5636");
    px(hx-6, hy-4, 13, 5, "#7d6641");
    px(hx-3, hy-7, 7, 4, "#8f764c");
    px(hx-2, hy-7, 3, 2, "#a68a5c");
  }
  // woods
  for(let i=0;i<22;i++){
    const tx = 20 + rnd()*(W-40), ty = 150 + rnd()*118;
    if(ty > 250 && Math.abs(tx-320) < 110) continue;      // keep the buttons clear
    px(tx, ty, 2, 4, "#5c4326");
    px(tx-3, ty-6, 8, 6, "#4f6b3a");
    px(tx-2, ty-9, 6, 4, "#5e7d45");
  }
  // compass rose
  const cxr = 566, cyr = 292;
  px(cxr-1, cyr-13, 3, 26, "#8f764c");
  px(cxr-13, cyr-1, 26, 3, "#8f764c");
  px(cxr-2, cyr-16, 5, 5, "#c9a227");
  px(cxr-4, cyr-4, 9, 9, "#6b5636");
  px(cxr-2, cyr-2, 5, 5, "#c9a227");
  txt("N", cxr, cyr-18, 7, "#c9a227", "center", false);

  ribbon(W/2-92, 38, 184, 22, "#4a3a24", "#2c2115", "#6d5836");
  txt("THE CAMPAIGN", W/2, 52, 14, "#ffd75e", "center");
  ctx.drawImage(coinImg, W/2-42, 66);
  txt(SAVE.renown+"  renown", W/2+8, 76, 10, "#e8dcc0", "center");

  // route within each world
  for(let i=0;i<9;i++){
    if(i%3===2) continue;
    const a=mapNode(i), b=mapNode(i+1), done=SAVE.progress>i+1;
    for(let t=0;t<1;t+=0.06){
      const x=a.x+(b.x-a.x)*t, y=a.y+(b.y-a.y)*t;
      px(x-1,y-1,3,3, done?"#c9a227":"#5d4a30");
    }
  }
  for(let wi=0; wi<3; wi++){
    const first = wi*3;
    const unlocked = SAVE.progress > first;
    const n0 = mapNode(first);
    txt(WORLDS[wi].short, 26, n0.y+3, 8,
        unlocked?"#e8dcc0":"#6a6153", "left", false);
    if(!unlocked) continue;
    ctx.font='7px "Courier New",monospace'; ctx.textAlign="left";
    ctx.fillStyle="#8a7e66"; ctx.fillText(WORLDS[wi].rule.slice(0,44), 26, n0.y+14);
  }
  for(let i=0;i<9;i++){
    const bn=i+1, done=SAVE.progress>bn, cur=SAVE.progress===bn, locked=SAVE.progress<bn;
    const b=nodeBox(i), n=mapNode(i);
    if(cur){ ctx.globalAlpha=0.6+Math.sin(G.wind*4)*0.4;
      rr(b.x-4,b.y-4,b.w+8,b.h+8,3,"#ffd75e"); ctx.globalAlpha=1; }
    panel(b.x,b.y,b.w,b.h, locked?"#3a3128":done?"#2f6b58":"#7a5a2a",
          P.panelD, locked?null:P.panelL, 3);
    txt(locked?"?":String(bn), b.x+b.w/2, b.y+b.h/2+5, 13,
        locked?"#6a6153":done?"#a8ffd8":"#ffe9a8", "center");
    if(!locked){
      const o = BATTLES[i].objective.type;
      txt(BATTLES[i].name.slice(0,15), n.x, n.y+32, 6, "#d8cdb4", "center", false);
      if(o!=="raze") txt(o.toUpperCase(), n.x, n.y+40, 6, "#9fd6bd", "center", false);
    }

function shopClick(p){
  for(let i=0;i<SHOP_TABS.length;i++){
    if(inBox(p, shopTab(i))){ G.shopTab = SHOP_TABS[i].id;
      tone(560,0.06,"square",0.04); return true; }
  }
  if(G.shopTab === "heroes"){
    for(const h of heroRows()){
      if(h.owned || !inBox(p, h.buy)) continue;
      if(SAVE.renown < h.cost){ tone(130,0.1,"square",0.03,0.6); return true; }
      SAVE.renown -= h.cost; SAVE.hero = h.key; saveGame();
      tone(523,0.12,"square",0.05,1.4); tone(784,0.18,"square",0.05,1.3,0.08);
      return true;
    }
    if(inBox(p, SHOP_BACK)){ G.scene="map"; tone(500,0.07,"square",0.05,0.8); return true; }
    return true;
  }
  for(const r of shopRows()){
    if(r.cost === null || !inBox(p, r.buy)) continue;
    if(SAVE.renown < r.cost){ tone(130,0.1,"square",0.03,0.6); return true; }
    SAVE.renown -= r.cost;
    if(r.kind==="unit") SAVE.unlocked[r.key] = true;
    else SAVE.upgrades[r.key] = upLvl(r.key)+1;
    saveGame();
    tone(660,0.1,"square",0.05,1.5); tone(990,0.14,"square",0.04,1.4,0.07);
    return true;
  }
  if(inBox(p, SHOP_BACK)){ G.scene="map"; tone(500,0.07,"square",0.05,0.8); return true; }
  return true;
}

// reads as this place rather than a separate slideshow. Any input skips.

const OPENING = [
  { t:3.6, line:"The marches have been quiet for a hundred years.",
    sub:"Grain, river mist, and nobody's war." },
  { t:3.8, line:"They came at dawn, out of the eastern waste.",
    sub:"No demands. No parley. Just the drums." },
  { t:3.8, line:"One keep stands between them and the heartland.",
    sub:"Yours." },
  { t:3.2, line:"", sub:"" },
];
function openingTick(dt){
  G.sceneT += dt;
  const b = OPENING[G.beat];
  if(!b) { openingDone(); return; }
  if(G.sceneT >= b.t){ G.beat++; G.sceneT = 0;
    if(G.beat >= OPENING.length) openingDone();
    else tone(220 + G.beat*60, 0.22, "triangle", 0.04, 1.2);
  }
}
function openingDone(){
  OPT.introSeen = true; saveOpt();
  G.scene = "title"; G.sceneT = 0; G.beat = 0;
}
function drawOpening(){
  const beat = Math.min(G.beat, OPENING.length-1);
  drawHomeScene();
  // the horde gathers on the right as the beats progress
  if(beat >= 1){
    const n = beat === 1 ? 5 : 9;
    for(let i=0;i<n;i++){
      const S = SPR[["spear","knight","archer"][i%3]][-1];
      const x = 596 - (i%5)*17 - (i>4?9:0);
      const y = GROUND_Y + ROW_Y[(i*2)%ROWS]*0.7;
      ctx.globalAlpha = 0.55 + (i%3)*0.15;
      ctx.drawImage(S.frames[i%2], x - S.w/2, y - S.h);
      ctx.globalAlpha = 1;
    }
    glow(600, GROUND_Y-40, 90, "rgba(200,60,40,1)", 0.28 + (beat>=2?0.12:0));
  }
  px(0,0,W,H, beat===3 ? "rgba(10,8,16,0.72)" : "rgba(10,8,16,0.40)");

  if(beat === 3){
    const bob = Math.sin(G.sceneT*2.2)*2;
    txt("BANNERLINE", W/2, 150+bob, 42, "#f7e9b8", "center");
    txt("BANNERLINE", W/2, 149+bob, 42, "#ffd75e", "center", false);
    ribbon(W/2-96, 168, 192, 18, "#4a5560", "#2f3843", "#6d7a86");
    txt("HOLD THE LINE", W/2, 181, 9, "#dfe7ec", "center");
  } else {
    const b = OPENING[beat];
    const fade = Math.min(1, G.sceneT*1.8) * Math.min(1, (b.t-G.sceneT)*2.2);
    ctx.globalAlpha = Math.max(0, fade);
    panel(W/2-206, 132, 412, 52, "#1e2630", "#10161d", "#3d4a56", 2);
    px(W/2-203, 135, 3, 46, "#ffd75e");
    txt(b.line, W/2+4, 156, 11, "#ffe9a8", "center");
    txt(b.sub,  W/2+4, 174, 8, "#c9d4dc", "center");
    ctx.globalAlpha = 1;
  }
  drawTray();          // otherwise the strip under the scene is dead black
  txt("press anything to skip", W/2, 322, 7, "#9a8f80", "center", false);
  // beat pips
  for(let i=0;i<OPENING.length;i++)
    px(W/2 - OPENING.length*5 + i*10, 338, 7, 3, i<=beat ? "#ffd75e" : "#5d4630");
}

    const cx = ((i*181 + G.wind*4) % (W+120)) - 60, cy = 12 + (i%3)*13;

  px(0,BAND_BOT-4,W,4,P.ownPd);

  for(const sc of SCENERY.field){ propShadow(sc.k, sc.x, sc.y); blitProp(sc.k, sc.x, sc.y, sc.ph); }
  // the two houses facing each other, at full strength
  for(const [k,side] of [[G.keepP,1],[G.keepE,-1]]){
    const cx = Math.round(sx(k.x));
    ctx.globalAlpha=.26; px(cx-30, GROUND_Y-4, 60, 7, "#000"); ctx.globalAlpha=1;

  for(const sc of SCENERY.fore){ propShadow(sc.k, sc.x, sc.y); blitProp(sc.k, sc.x, sc.y, sc.ph); }
  drawLeaves(); drawGlows(); drawGrade();
}

  txt(o.title, W/2, yy, 34, c, "center");
  txt(o.sub, W/2, yy+22, 9, "#d8d0c0", "center");

  panel(W/2-124, 128, 248, 84, "#33261a", P.panelD, P.panelL, 2);
  const rows = [
    ["FURTHEST PUSH", Math.round(G.stats.maxFront)+" / 100"],
    ["UNITS SENT",    G.stats.sent],
    ["GOLD SPENT",    G.stats.spent],
    ["ENEMIES SLAIN", G.stats.kills],
    ["RENOWN",        (G.over&&G.over.title==="VICTORY")?"+"+(G.battle>=SAVE.progress-1?120:40):"0"],
    ["KEEP REMAINING", Math.ceil(G.keepP.hp)+" vs "+Math.ceil(G.keepE.hp)],
  ];
  rows.forEach((r,i)=>{
    const y = 146 + i*14;
    txt(r[0], W/2-112, y, 8, "#b0a48c", "left", false);
    txt(String(r[1]), W/2+112, y, 9, "#ffe9a8", "right", false);
  });

  panel(W/2-88, 228, 176, 26, P.panel, P.panelD, P.panelL, 2);
  const pulse = 0.72 + Math.sin(G.sceneT*4)*0.28;
  ctx.globalAlpha = pulse;
  txt("CLICK OR PRESS R", W/2, 246, 11, "#ffe9a8", "center");
  ctx.globalAlpha = 1;
}

// The lane is horizontal by design — a portrait phone would show a sliver of
// it. Ask for landscape rather than pretending a 390px-wide field works.
function drawRotateHint(){
  px(0,0,W,H,"rgba(9,7,14,0.93)");
  const cx = W/2, cy = 138;
  // a little phone turning
  const a = Math.sin(G.wind*1.6)*0.5 - 0.5;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(a);
  px(-17,-28,34,56,"#241b2b");
  px(-14,-24,28,44,"#4f9ad0");
  px(-14,-24,28,10,"#95d8f0");
  px(-5,20,10,3,"#8a8070");
  ctx.restore();
  txt("ROTATE YOUR DEVICE", cx, 208, 15, "#ffd75e", "center");
  txt("Bannerline is played sideways —", cx, 232, 9, "#d8cdb4", "center");
  txt("you need to see the whole battle line.", cx, 246, 9, "#d8cdb4", "center");
  txt("tap to play anyway", cx, 282, 8, "#8fa0ad", "center");
}

function render(){
  if(IS_PORTRAIT && !G.ignorePortrait){ drawRotateHint(); return; }
  if(G.scene==="opening")     drawOpening();
  else if(G.scene==="bestiary") drawBestiary();
  else if(G.scene==="map")    drawMap();
  else if(G.scene==="shop")   drawShop();
  else if(G.scene==="title")  drawTitle();
  else if(G.scene==="intro")  drawIntro();
  else if(G.scene==="result") drawResult();
  else { drawBattlefield(); drawHUD(); drawTutorial(); }
  if(G.overlay==="pause")         drawPauseMenu();
  else if(G.overlay==="settings") drawSettingsMenu();
}

//////////////////////////////////////////////////////////////////////////////
// INPUT
//////////////////////////////////////////////////////////////////////////////
let hoverCard = -1, hoverMenu = null, hoverGear = false;
function toInternal(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
}
function inBox(p,b){
  // coarse pointers get a forgiving margin around every control
  const m = IS_TOUCH ? 6 : 0;
  return p.x>=b.x-m && p.x<=b.x+b.w+m && p.y>=b.y-m && p.y<=b.y+b.h+m;
}

function startBattle(){
  unlockAudio();
  G.started = true;
  reset();
  if(!OPT.tutorialDone) tutStart();      // first ever battle is guided
  if(SAVE.hero) spawnHero();            // heroes join at battle start only
  G.speed = OPT.fastDefault ? 2 : 1;
  G.overlay = null;
  G.scene = "intro"; G.sceneT = 0;
  tone(392,0.18,"square",0.05,1.5); tone(523,0.26,"square",0.05,1.4,0.12);
}

cv.addEventListener("mousemove", e=>{
  const p = toInternal(e); hoverCard = -1; hoverMenu = null; hoverGear = false;
  let hot = false;
  if(G.overlay==="pause"){
    for(const b of pauseLayout()) if(inBox(p,b)){ hoverMenu=b.label; hot=true; }
  } else if(G.overlay==="settings"){
    const L = settingsLayout();
    for(const r of L.rows){
      if(r.type==="slider" || r.type==="choice"){
        if(inBox(p,r.minus)){ hoverMenu=r.key+"-"; hot=true; }
        if(inBox(p,r.plus)){ hoverMenu=r.key+"+"; hot=true; }
        if(r.bar && inBox(p,r.bar)) hot=true;
      } else if(inBox(p,r.tog)) hot=true;
    }
    if(inBox(p,L.back)){ hoverMenu="BACK"; hot=true; }
  } else if(G.scene==="map"){
    if(inBox(p,MAP_SHOP)){ hoverMenu="SHOP"; hot=true; }
    if(inBox(p,MAP_BACK)){ hoverMenu="MAPBACK"; hot=true; }
    for(let i=0;i<9;i++) if(SAVE.progress>=i+1 && inBox(p,nodeBox(i))) hot=true;
  } else if(G.scene==="shop"){
    for(let i=0;i<SHOP_TABS.length;i++) if(inBox(p,shopTab(i))) hot=true;
    if(G.shopTab==="heroes"){
      for(const h of heroRows()) if(!h.owned && inBox(p,h.buy)){ hoverMenu="HERO"+h.key; hot=true; }
    } else {
      for(const r of shopRows()) if(r.cost!==null && inBox(p,r.buy)){ hoverMenu="BUY"+r.key; hot=true; }
    }
    if(inBox(p,SHOP_BACK)){ hoverMenu="SHOPBACK"; hot=true; }
  } else if(G.scene==="bestiary"){
    if(inBox(p,BEST_BACK)){ hoverMenu="BESTBACK"; hot=true; }
  } else if(G.scene==="title"){
    for(let i=0;i<HOME_BTN.length;i++)
      if(inBox(p, homeBtn(i))){ hoverMenu=HOME_BTN[i].id; hot=true; }
    if(inBox(p,HOME_DL)){ hoverMenu="TD-"; hot=true; }
    if(inBox(p,HOME_DR)){ hoverMenu="TD+"; hot=true; }
  } else if(G.scene==="play"){
    roster().forEach((k,i)=>{ if(inBox(p,cardRect(i))){ hoverCard=i; hot=true; } });
    if(SAVE.hero && inBox(p,HERO_BTN)){ hoverMenu="HERO"; hot=true; }
    if(inBox(p,GEAR_BTN)){ hoverGear=true; hot=true; }
    if(inBox(p,SPEED_BTN)) hot=true;
  }
  cv.style.cursor = hot ? "pointer" : "default";
});
cv.addEventListener("pointerdown", e=>{
  e.preventDefault(); unlockAudio();
  if(AC && AC.state === "suspended") AC.resume();      // iOS needs this
  if(IS_PORTRAIT && !G.ignorePortrait){ G.ignorePortrait = true; return; }
  const p = toInternal(e);
  if(menuClick(p)) return;                 // overlays swallow input first
  if(G.scene==="opening"){ openingDone(); return; }
  if(G.scene==="shop"){ shopClick(p); return; }
  if(G.scene==="map"){
    if(inBox(p,MAP_SHOP)){ G.scene="shop"; tone(600,0.08,"square",0.05,1.3); return; }
    if(inBox(p,MAP_BACK)){ G.scene="title"; G.sceneT=0; return; }
    for(let i=0;i<9;i++){
      if(SAVE.progress < i+1) continue;            // locked
      if(inBox(p, nodeBox(i))){ G.battle=i+1; startBattle(); break; }
    }
    return;
  }
  if(G.scene==="bestiary"){
    if(inBox(p,BEST_BACK)){ G.scene="title"; G.sceneT=0; tone(500,0.07,"square",0.05,0.8); }
    return;
  }
  if(G.scene==="title"){
    if(inBox(p,HOME_DL)){ OPT.difficulty=(OPT.difficulty+DIFF.length-1)%DIFF.length;
      saveOpt(); unlockAudio(); tone(420,0.06,"square",0.04); return; }
    if(inBox(p,HOME_DR)){ OPT.difficulty=(OPT.difficulty+1)%DIFF.length;
      saveOpt(); unlockAudio(); tone(700,0.06,"square",0.04); return; }
    for(let i=0;i<HOME_BTN.length;i++){
      if(!inBox(p, homeBtn(i))) continue;
      unlockAudio(); tone(620,0.08,"square",0.05,1.3);
      const id = HOME_BTN[i].id;
      if(id==="CAMPAIGN")      { G.scene="map"; G.sceneT=0; }
      else if(id==="BESTIARY") { G.scene="bestiary"; G.sceneT=0; }
      else                     { G.overlay="settings"; }
      return;
    }
    return;                                  // menu, not a start button
  }
  if(G.scene==="result"){ G.scene="map"; G.sceneT=0; return; }
  if(G.scene==="intro"){ G.scene="play"; G.sceneT=0; return; }
  if(inBox(p,SPEED_BTN)){ G.speed = G.speed===1?2:1; return; }
  if(inBox(p,GEAR_BTN)){ G.overlay="pause"; return; }
  if(SAVE.hero && inBox(p,HERO_BTN)){ heroAbility(); return; }
  if(p.y > BAND_TOP-8 && p.y < BAND_BOT+8){        // click a lane to select it
    G.lane = nearestOpenLane(laneAt(p.y)); G.laneFlash = 1; G.tut.laneMoved = true;
    tone(500+G.lane*40, 0.05, "square", 0.03); return;
  }
  roster().forEach((k,i)=>{ if(inBox(p,cardRect(i))) tryBuy(k); });
});
addEventListener("keydown", e=>{
  unlockAudio();
  const k = e.key.toLowerCase();
  if(G.scene==="opening"){ openingDone(); e.preventDefault(); return; }
  if(G.scene==="title" && (k==="enter"||k===" ")){ G.scene="map"; G.sceneT=0; e.preventDefault(); return; }
  if((G.scene==="bestiary"||G.scene==="shop") && k==="escape"){
    G.scene = G.scene==="shop" ? "map" : "title"; e.preventDefault(); return; }
  if(G.scene==="map" && k==="escape"){ G.scene="title"; e.preventDefault(); return; }
  if(G.scene==="intro"){ G.scene="play"; G.sceneT=0; }
  if(k==="arrowup" || k==="w"){ G.lane=stepLane(-1); G.laneFlash=1;
    G.tut.laneMoved=true; tone(560,0.05,"square",0.03); }
  else if(k==="arrowdown"){ G.lane=stepLane(1); G.laneFlash=1;
    G.tut.laneMoved=true; tone(460,0.05,"square",0.03); }
  else if(k==="1") tryBuy("spear");
  else if(k==="2") tryBuy("knight");
  else if(k==="3") tryBuy("archer");
  else if(k==="4" && SAVE.unlocked.mage) tryBuy("mage");
  else if(k===" " || k==="spacebar") heroAbility();
  else if(k==="s") G.speed = G.speed===1?2:1;
  else if(k==="m"){
    if(OPT.music>0 || OPT.sfx>0){ OPT._m=OPT.music; OPT._s=OPT.sfx; OPT.music=0; OPT.sfx=0; }
    else { OPT.music=OPT._m??0.7; OPT.sfx=OPT._s??0.8; }
    applyVolumes(); saveOpt();
  }
  else if(k==="r"){ if(G.scene==="result"){ G.scene="map"; G.sceneT=0; } else startBattle(); }
  else if(k==="p" || k==="escape"){
    if(G.tut.on && !G.overlay){ tutFinish(); e.preventDefault(); return; }
    if(G.overlay==="settings") G.overlay="pause";
    else if(G.overlay==="pause") G.overlay=null;
    else if(G.scene==="play") G.overlay="pause";
  }
  else return;
  e.preventDefault();
});

//////////////////////////////////////////////////////////////////////////////
// LOOP  (watchdog: RAF stalls when the preview pane is hidden)
//////////////////////////////////////////////////////////////////////////////
let IS_TOUCH = false, IS_PORTRAIT = false;
function fit(){
  // Take the SMALLER of the two sources: visualViewport shrinks for the
  // on-screen keyboard/URL bar, but can also over-report, so neither alone
  // is trustworthy.
  const vv = window.visualViewport;
  const vw = Math.max(1, Math.min(innerWidth,  vv ? vv.width  : Infinity));
  const vh = Math.max(1, Math.min(innerHeight, vv ? vv.height : Infinity));
  // NO Math.max(1,..) here — clamping the scale up overflowed every phone.
  const pad = vw < 700 ? 0 : 16;
  const sc  = Math.min((vw-pad)/W, (vh-pad)/H);
  cv.style.width  = Math.floor(W*sc)+"px";
  cv.style.height = Math.floor(H*sc)+"px";
  // size, not pointer type: a narrow portrait window cannot show a lane
  // game whatever the input device, and this is actually testable.
  IS_PORTRAIT = vh > vw * 1.04 && vw < 620;
  IS_TOUCH = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window
            || vw < 820;
}
addEventListener("resize", fit);
addEventListener("orientationchange", ()=>setTimeout(fit, 120));
if(window.visualViewport) visualViewport.addEventListener("resize", fit);
// iOS won't scroll-bounce a fixed body, but it will still rubber-band touches
document.addEventListener("touchmove", e=>e.preventDefault(), {passive:false});

let last = performance.now();
function step(now){
  let dt = (now-last)/1000; last = now;
  if(dt > 0.1) dt = 0.1;
  G.sceneT += dt;
  G.wind += dt;          // render-only clock (sway, birds, leaves)
  G.laneFlash = Math.max(0, G.laneFlash - dt*3);
  tickMusic();

  if(G.scene==="intro" && G.sceneT > 2.3){ G.scene="play"; G.sceneT=0; }

  if(!G.paused && !G.overlay){
    // hit-stop lives in the loop, never in update(), so the headless
    // balance harness stays a pure function of dt.
    if(G.hitstop > 0){ G.hitstop -= dt; }
    else if(G.scene==="opening"){ openingTick(dt); }
    else if(G.scene==="title"){ /* home is a place, not a live match */ }
    else if(G.scene==="play"){ tutStep(dt); heroTick(dt); for(let i=0;i<G.speed;i++) update(dt); }
    else if(G.scene==="result"){ stepFx(dt); }
  }
  render();
}
function frame(now){ step(now); requestAnimationFrame(frame); }

// boot
bakeAll(); bakeCoin(); bakeGear(); buildScenery(); fit();
if(!OPT.introSeen){ G.scene = "opening"; G.sceneT = 0; G.beat = 0; }
requestAnimationFrame(frame);
setInterval(()=>{ const now=performance.now(); if(now-last > 220) step(now); }, 100);

//////////////////////////////////////////////////////////////////////////////
// DEBUG / BALANCE HARNESS
//////////////////////////////////////////////////////////////////////////////
window.__bannerline = {
  G, TYPES, spawn, reset, tryBuy, update, SPR, PROP, render, OPT, DIFF,
  setTerrK(v){ TERR_K = v; }, getTerrK(){ return TERR_K; },
  setDiff(v){ OPT.difficulty = v; }, getDiff(){ return DIFF[OPT.difficulty].name; },
  tutStart, tutStep, tutFinish, TUT,
  SAVE, saveGame, wipeSave, UPGRADES, roster, BATTLES,
  HEROES, spawnHero, heroTick, heroAbility,
  sim(seconds, policy){
    reset();
    const dt = 1/30;
    for(let i=0; i<seconds/dt && !G.over; i++){
      if(policy) policy(G, tryBuy);
      update(dt);
    }
    return this.snapshot();
  },
  snapshot(){ return {
    t:+G.t.toFixed(2), front:+G.front.toFixed(1),
    gold:Math.floor(G.gold), eGold:Math.floor(G.eGold),
    keepP:Math.ceil(G.keepP.hp), keepE:Math.ceil(G.keepE.hp),
    units:G.units.length, over:G.over,
    banners:G.banners.map(b=>b.owner),
  };},
};
</script>
